name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint e import (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Compila tutti i moduli
        run: python -m compileall -q core ui main.py version.py

      # I moduli core non dipendono dall'interfaccia, quindi si importano
      # anche su un runner senza display: è il test più utile che la CI può
      # fare senza una suite vera.
      - name: Importa i moduli core
        run: |
          python -c "import version; print(version.APP_NAME, version.__version__)"
          python -c "from core.scanner import Scanner, FileInfo; print('scanner ok')"
          python -c "from core.organizer import Organizer, CATEGORIES; print('organizer ok,', len(CATEGORIES), 'categorie')"
          python -c "from core.ai_classifier import AIClassifier; print('classifier ok,', len(AIClassifier.ALLOWED_CATEGORIES), 'categorie ammesse')"
          python -c "from core.settings import Settings, data_dir; print('settings ok')"

      - name: La pianificazione non deve scrivere sul disco
        run: python .github/scripts/check_plan_is_pure.py

  build:
    name: Build .exe
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: >
          pyinstaller --noconsole --onefile
          --name SmartFileOrganizer
          --collect-all customtkinter
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFileOrganizer-${{ github.ref_name }}
          path: dist/SmartFileOrganizer.exe
          if-no-files-found: error
