name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint and import (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q core ui main.py version.py

      # The core modules have no dependency on the UI, so they import even on a
      # runner without a display: the most useful check CI can do without a
      # real test suite.
      - name: Import the core modules
        run: |
          python -c "import version; print(version.APP_NAME, version.__version__)"
          python -c "from core.scanner import Scanner, FileInfo; print('scanner ok')"
          python -c "from core.organizer import Organizer, CATEGORIES; print('organizer ok,', len(CATEGORIES), 'categories')"
          python -c "from core.ai_classifier import AIClassifier; print('classifier ok,', len(AIClassifier.ALLOWED_CATEGORIES), 'allowed categories')"
          python -c "from core.settings import Settings, data_dir; print('settings ok')"

      - name: Planning must not write to disk
        run: python .github/scripts/check_plan_is_pure.py

  build:
    name: Build and publish the release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    # Needed by `gh release create` to create the release and upload the assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # --collect-all customtkinter is required in both builds: the library
      # loads its own theme files at runtime and without it the app starts and
      # exits at once.
      - name: PyInstaller — single file
        run: >
          pyinstaller --noconsole --onefile
          --name SmartFileOrganizer
          --collect-all customtkinter
          --distpath dist/onefile --workpath build/onefile
          main.py

      # A --onedir build is shipped alongside it because --onefile unpacks
      # itself into a temp folder at startup, which is structurally what
      # droppers do and is one of the most frequently flagged heuristics.
      # The folder build does not self-extract and tends to be flagged less.
      - name: PyInstaller — portable folder
        run: >
          pyinstaller --noconsole --onedir
          --name SmartFileOrganizer
          --collect-all customtkinter
          --distpath dist/onedir --workpath build/onedir
          main.py

      - name: Zip the portable build
        run: >
          Compress-Archive
          -Path dist/onedir/SmartFileOrganizer
          -DestinationPath "dist/SmartFileOrganizer-${env:GITHUB_REF_NAME}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFileOrganizer-${{ github.ref_name }}
          path: |
            dist/onefile/SmartFileOrganizer.exe
            dist/*-portable.zip
          if-no-files-found: error

      - name: Create the GitHub release and attach the builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXE="dist/onefile/SmartFileOrganizer.exe"
          ZIP="dist/SmartFileOrganizer-${GITHUB_REF_NAME}-portable.zip"

          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          EXE_MB=$(( $(stat -c%s "$EXE") / 1048576 ))
          ZIP_MB=$(( $(stat -c%s "$ZIP") / 1048576 ))

          cat > notes.md <<EOF
          Standalone Windows build — no Python installation required.

          **Note:** the user interface and the folder names the app creates are
          in Italian. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme)
          for what to expect, and the
          [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)
          for what changed in this version.

          ### Which one to download

          | File | Size | Notes |
          |------|------|-------|
          | \`SmartFileOrganizer.exe\` | ${EXE_MB} MB | Single file, just run it |
          | \`SmartFileOrganizer-${GITHUB_REF_NAME}-portable.zip\` | ${ZIP_MB} MB | Unpack and run the exe inside. Try this one if the single file is blocked |

          ### Windows will warn you

          Your browser or Windows SmartScreen will likely say the file is not
          commonly downloaded, or that the publisher is unknown. **This is
          expected.** The build is not code-signed — a certificate is a
          recurring cost this project does not carry — and a brand new binary
          has no download reputation yet. The single-file build also unpacks
          itself at startup, a pattern antivirus heuristics treat with
          suspicion regardless of what the program does.

          You do not have to take that on trust. Every build is produced by a
          [public workflow run](https://github.com/${GITHUB_REPOSITORY}/actions)
          from the exact commit below, on GitHub's own runners, and the sources
          are in this repository. Check the hash of what you downloaded against
          the values here.

          ### Verify your download

          \`\`\`
          SHA-256  ${EXE_SHA}  SmartFileOrganizer.exe
          SHA-256  ${ZIP_SHA}  SmartFileOrganizer-${GITHUB_REF_NAME}-portable.zip
          \`\`\`

          \`\`\`powershell
          Get-FileHash .\\SmartFileOrganizer.exe -Algorithm SHA256
          \`\`\`

          Built from \`${GITHUB_SHA}\` by this workflow run, not on a developer
          machine, so the binaries carry no personal paths.
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            "$EXE" "$ZIP" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Smart File Organizer ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
