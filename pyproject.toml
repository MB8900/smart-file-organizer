[project]
name = "smart-file-organizer"
version = "1.1.0"
description = "Riordina una cartella per tipo, trova i duplicati per contenuto e classifica i documenti con un LLM locale."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marber" }]
keywords = ["file-organizer", "duplicate-finder", "sha256", "customtkinter", "local-llm"]

# PolyForm Noncommercial non è una licenza approvata OSI: il progetto non è
# pensato per la pubblicazione su PyPI, e questi metadati servono agli
# strumenti di sviluppo locali.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Natural Language :: Italian",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
  "Private :: Do Not Upload",
]

dependencies = [
  "customtkinter>=5.2.2",
  "send2trash>=1.8.3",
  "pypdf>=3.17.4",
  "python-docx>=1.1.2",
  "Pillow>=10.4.0",
  "requests>=2.32.0",
]

[project.urls]
Repository = "https://github.com/MB8900/smart-file-organizer"
Issues = "https://github.com/MB8900/smart-file-organizer/issues"
Changelog = "https://github.com/MB8900/smart-file-organizer/blob/main/CHANGELOG.md"
Architettura = "https://github.com/MB8900/smart-file-organizer/blob/main/docs/ARCHITECTURE.md"

[project.gui-scripts]
smart-file-organizer = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # la lunghezza riga la governa il formattatore
  "SIM105",  # try/except/pass è intenzionale sui percorsi non critici
  "SIM108",  # un if/else esplicito si legge meglio di un ternario lungo
]

[tool.ruff.lint.per-file-ignores]
"ui/*" = ["B008"]
